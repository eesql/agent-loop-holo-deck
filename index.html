<title>Chloris Agent HQ</title>

<style>
/* Layout: agent-first HQ — isometric office floor (one room per agent, hub, decision desk, waiting area, archive) center stage; overview + throughput on the right; four task cards below. Deliberate single light look (white glass, soft blue). */
:root{
  color-scheme:light;
  --bg1:#f1f5fb; --bg2:#e3ebf6; --card:rgba(255,255,255,.92); --ink:#0f1b2d; --ink2:#3c4a5e; --muted:#5b6b80; --faint:#6b7a8f; --line:#e3e9f2;
  --blue:#2f6bff; --blue-d:#1d4fd8; --cyan:#18b4d8; --amber:#f59e0b; --orange:#f97316; --red:#f04438; --green:#16b364; --violet:#6d5df5;
  --f:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --rx:56deg; --rz:-36deg; --s:1;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--f);font-size:13px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)} a:hover{color:var(--blue-d)}
.shell{max-width:1440px;margin:0 auto;border-radius:32px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.95);box-shadow:0 30px 80px rgba(40,70,130,.10);padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.pillbox{height:48px;border-radius:24px;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(40,70,130,.06);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:14px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;padding-left:8px;margin-right:8px}
.logo b{font-size:21px;font-weight:800;letter-spacing:-.01em} .logo b span{color:var(--blue)}
.search{flex:1 1 260px;max-width:420px;position:relative;padding:0}
.search label{display:flex;align-items:center;gap:10px;width:100%;height:100%;padding:0 18px}
.search input{all:unset;flex:1;min-width:0;font-size:14px}
.sres{position:absolute;left:0;right:0;top:54px;z-index:20;background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(30,60,120,.18);padding:6px;max-height:340px;overflow:auto}
.sres button{display:grid;grid-template-columns:auto 1fr;gap:0 10px;width:100%;text-align:left;padding:8px 10px;border-radius:12px}

.sel{position:relative;padding:0}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;height:100%;padding:0 38px 0 18px;font-size:14px;cursor:pointer;border-radius:24px;max-width:220px}
.sel svg{position:absolute;right:16px;top:50%;margin-top:-6px;pointer-events:none}
.sp{flex:1}
.ibtn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(40,70,130,.06);display:grid;place-items:center;position:relative;flex:none}
.ibtn .rd{position:absolute;top:11px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.user{height:56px;border-radius:28px;padding:0 18px 0 6px}
.user .e{width:44px;height:44px;border-radius:50%;background:#1f2a3d;color:#fff;font-weight:700;display:grid;place-items:center}

.titlebar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding:4px 8px 0}
h1{margin:0;font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-wrap:balance} h1 span{color:var(--blue)}
.sub{margin:4px 0 0;font-size:15px;color:var(--ink2)}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools .ibtn{width:44px;height:44px}
.live{height:44px;padding:0 16px;border-radius:22px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(40,70,130,.08);background:#dcf7e8;color:#0d6b3a}

.live.err{background:#fee4e2;color:#912018}.live.err i{background:var(--red);box-shadow:0 0 0 4px rgba(240,68,56,.2)}

.main{display:grid;grid-template-columns:68px minmax(0,1fr) 328px;gap:16px;align-items:start}
.rail{border-radius:26px;background:var(--card);box-shadow:0 10px 30px rgba(40,70,130,.08);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:12px}

.stage{position:relative;height:600px;overflow:hidden;border-radius:24px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

.plane{position:absolute;left:50%;top:50%;width:760px;height:560px;margin:-280px 0 0 -380px;transform-style:preserve-3d;
  transform:translateY(34px) scale(var(--s)) rotateX(var(--rx)) rotateZ(var(--rz))}
.ov3{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.plane *{transform-style:preserve-3d}
.legend{position:absolute;left:14px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);max-width:calc(100% - 28px);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block}
.hint{position:absolute;right:14px;bottom:10px;font-size:11.5px;color:var(--faint);pointer-events:none}
.tip{position:absolute;z-index:6;pointer-events:none;max-width:280px;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(30,60,120,.18);padding:8px 11px;font-size:12px;line-height:1.45}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:7;width:min(460px,calc(100% - 28px));background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(30,60,120,.16);padding:12px 16px;font-size:12.5px;text-align:center}
.banner b{color:var(--red)} .banner.demo b{color:var(--amber)}
.banner button{margin-top:8px;background:var(--blue);color:#fff;padding:7px 14px;border-radius:999px;font-weight:700}

/* 3D primitives */
.fl{position:absolute;background-color:#f9fbfe;background-image:linear-gradient(rgba(47,107,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(47,107,255,.045) 1px,transparent 1px);background-size:20px 20px;border:1px solid #e3e9f2;cursor:pointer}
.fl.hot{background-color:#fff6f3;box-shadow:inset 0 0 50px rgba(240,68,56,.22)}

.wr{position:absolute;top:0;width:38px;transform-origin:0 50%;transform:rotateY(-90deg);background:linear-gradient(90deg,#dbe3ee,#f6f8fc);border:1px solid #d3dce8;border-right:3px solid #fff}
.win{position:absolute;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(150,190,240,.55) 0 30px,rgba(255,255,255,.9) 30px 33px)}

.desk{position:absolute;height:28px;transform:translateZ(14px);background:#fff;border:1px solid #dde4ee;border-radius:3px}

.m-run{background:linear-gradient(#7ee6ff,#18b4d8);box-shadow:0 0 12px rgba(24,180,216,.75)}
.m-todo{background:linear-gradient(#7fb0ff,#2f6bff);box-shadow:0 0 10px rgba(47,107,255,.6)}

.av{position:absolute;width:28px;height:42px;left:-14px;top:-21px;display:flex;flex-direction:column;align-items:center;cursor:pointer}

.sect>h3 span{font-size:12px;font-weight:500;color:var(--muted)}
.tcard{border-radius:16px;border:1px solid var(--line);padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.tcard.me{border-color:#fdc9c3;background:#fff8f7}.tcard.run{border-color:#bfeaf5;background:#f5fcfe}.tcard.todo{border-color:#dbe5ff;background:#f6f9ff}.tcard.ext{border-color:#fde1c8;background:#fffaf5}.tcard.stale{border-color:#fde68a;background:#fffbeb}
.tcard .r1{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tcard .r1 .pill{margin-left:auto}
.tcard b{font-size:14px;overflow-wrap:anywhere}
.tcard p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.55;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .lk{display:flex;gap:12px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#edf1f7}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.lg span{display:flex;align-items:center;gap:5px} .lg i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bars{display:grid;gap:6px;align-items:end;height:100px;padding:0 2px;border-bottom:1px solid var(--line)}
.bars span{border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars span b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px}
.drow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef2f7}
.cta{margin-top:auto;min-height:48px;border-radius:14px;background:var(--blue);color:#fff!important;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 10px 24px rgba(47,107,255,.3)}

@media (max-width:1200px){
  .main{grid-template-columns:68px minmax(0,1fr)}
  .rcol{grid-column:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .shell{padding:14px;border-radius:22px}
  h1{font-size:32px}
  .main{grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;justify-content:space-around;padding:6px}
  .rail button{width:44px;height:44px}
  .rcol{grid-column:auto;display:flex}
  .stage{height:420px}
  .bottom{grid-template-columns:minmax(0,1fr)}
  .user .nm{display:none} .user{padding:0 6px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  .av.work,.ring.pulse,.flow.h,.flow.v{animation:none}
}

<script>
(function(){
"use strict";
/* ---------- data source: saved Notion views (no SQL quota) ---------- */
const SERVER="Notion", TOOL="notion-query-data-sources";
const WORK_VIEW="https://www.notion.so/ef0e2713ea3948cf8ef4cfa3844da223?v=8f1b3bd326cf4c5cb4c1061eca2bdb68";
const PROJ_VIEW="https://www.notion.so/90b88827f5fe4b42a383c86dc34a93aa?v=22da8c9897c146cfb2940b372cd6aa1f";
const viewQ=(url,cursor)=>({data:Object.assign({mode:"view",view_url:url,page_size:100},cursor?{start_cursor:cursor}:{})});
const WORK_Q=viewQ(WORK_VIEW), PROJ_Q=viewQ(PROJ_VIEW);
const NOTION_DB="https://app.notion.com/p/ef0e2713ea3948cf8ef4cfa3844da223";

const AG={"Claude":{c:"#f08a4b",m:"C"},"Grok Bot":{c:"#3b82f6",m:"G"},"Chloris AI工作管理助手":{c:"#16b364",m:"管",s:"工作管理助手"},
  "DeepSeek":{c:"#6d5df5",m:"D"},"资深工程师":{c:"#ef4c5a",m:"工"},"Odoo数据协同助手":{c:"#b05ad8",m:"O",s:"Odoo 助手"},"人工":{c:"#94a3b8",m:"人"},
  "__eric__":{c:"#1f2a3d",m:"E",s:"Eric"}};
const EXTRA=["#0ea5e9","#14b8a6","#a855f7","#eab308","#64748b"];
const PLAT={claude:"Claude",grok_bot:"Grok Bot",deepseek_harness:"DeepSeek harness",manual:"人工"};
const PLATC={claude:"#f08a4b",grok_bot:"#3b82f6",deepseek_harness:"#6d5df5",manual:"#94a3b8"};
const ORD={"等我":0,"进行中":1,"等外部":2,"待办":3,"完成":4};
const PCLS={"等我":"me","进行中":"run","等外部":"ext","待办":"todo","完成":"done"};
const PLBL={"等我":"等你","进行中":"进行中","等外部":"等外部","待办":"待办","完成":"完成"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pid=u=>{const m=String(u||"").match(/[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);return m?m[0].replace(/-/g,"").toLowerCase():"";};
const ts=s=>s?Date.parse(String(s).replace(" ","T")):NaN;
const rel=v=>{if(!v)return[];if(Array.isArray(v))return v;try{return JSON.parse(v);}catch{return[];}};
const cleanTitle=s=>{const t=String(s||"").replace(/^\s*(?:(?:[\[【][^\]】]{1,8}[\]】]|TK-\d+)\s*)+/i,"");return t||String(s||"")||"(无标题)";};
const shortTitle=s=>{const i=s.indexOf("：");return i>0&&i<12?s.slice(i+1):s;};
const DAY=864e5;
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const md=k=>String(k).slice(5,10).replace("-","/");
const hm=t=>new Date(t).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
function ago(t){if(isNaN(t))return"";const h=(Date.now()-t)/36e5;if(h<1)return Math.max(1,Math.round(h*60))+" 分钟";if(h<48)return Math.round(h)+" 小时";return Math.floor(h/24)+" 天";}
function extractJSON(p){
  if(p&&typeof p==="object")return p;
  const s=String(p||""),i=s.indexOf("{");if(i<0)return null;let d=0,str=false,e=false;
  for(let k=i;k<s.length;k++){const c=s[k];
    if(str){if(e)e=false;else if(c==="\\")e=true;else if(c==='"')str=false;continue;}
    if(c==='"')str=true;else if(c==="{")d++;else if(c==="}"){d--;if(!d){try{return JSON.parse(s.slice(i,k+1));}catch{return null;}}}}
  return null;
}
const norm=r=>({url:r.url,key:pid(r.url),id:Number(r["任务ID"])||r["任务ID"],title:cleanTitle(r["标题"]),status:r["状态"]||"待办",agent:r["执行者"]||"未指派",
  platform:r["平台"]||"",next:r["下一步/等待原因"]||"",review:r["需复核"]==="__YES__",verdict:r["复核结论"]||"",done:r["date:完成日期:start"]||"",
  created:ts(r["创建时间"]),edited:ts(r["最后编辑时间"]),projects:rel(r["项目"]).map(pid),related:rel(r["关联任务"]).map(pid),summary:r["结果摘要"]||"",out:r["产出链接"]||""});

let items=[],projNames={},isDemo=false,lastOk=0,projFilter="",extraIdx=0;
function agentInfo(n){ if(!AG[n]){AG[n]={c:EXTRA[extraIdx++%EXTRA.length],m:String(n||"?").replace(/^Chloris\s*/,"").slice(0,1)};} return AG[n]; }
const sname=n=>agentInfo(n).s||n;
const light=c=>`color-mix(in srgb, ${c} 55%, white)`;
const pname=k=>projNames[k]||"未归类";
const live=()=>items.filter(t=>t.status!=="取消"&&(!projFilter||t.projects.includes(projFilter)));
const isOpen=t=>t.status!=="完成";
const isStale=t=>["进行中","等外部"].includes(t.status)&&Date.now()-t.edited>48*36e5;
const inWeek=t=>t.status==="完成"&&t.done&&Date.now()-ts(t.done.slice(0,10)+"T00:00:00")<7*DAY;
const needsRev=t=>t.review&&!t.verdict&&t.status==="完成";
const byUrl=u=>items.find(t=>t.url===u);
const openSort=(a,b)=>(ORD[a.status]-ORD[b.status])||((isStale(b)?1:0)-(isStale(a)?1:0))||a.edited-b.edited;
function pillFor(t){ if(isStale(t)&&t.status==="进行中") return `<span class="pill p-stale">停滞 ${ago(t.edited)}</span>`; return `<span class="pill p-${PCLS[t.status]||"todo"}">${PLBL[t.status]||esc(t.status)}</span>`; }

/* ---------- model ---------- */
function model(){
  const v=live(), agents=new Map();
  v.forEach(t=>{ if(!agents.has(t.agent)) agents.set(t.agent,[]); agents.get(t.agent).push(t); });
  const list=[...agents.entries()].map(([name,cs])=>{
    const open=cs.filter(isOpen), cnt=s=>cs.filter(t=>t.status===s).length;
    const me=cnt("等我"), run=cnt("进行中"), todo=cnt("待办"), ext=cnt("等外部"), done=cnt("完成");
    const staleRun=cs.filter(t=>t.status==="进行中"&&isStale(t)).length;
    let state="idle"; if(run) state=staleRun===run?"stale":"run"; else if(me) state="me"; else if(todo) state="todo"; else if(ext) state="ext";
    return {name,cards:cs,open,me,run,todo,ext,done,state};
  }).sort((a,b)=>b.open.length-a.open.length||b.cards.length-a.cards.length);
  return {v,agents:list};
}

/* ---------- 3D floor ---------- */
const R={A1:{x:0,y:0,w:250,h:180},A2:{x:250,y:0,w:250,h:180},A3:{x:500,y:0,w:260,h:180},B1:{x:0,y:180,w:210,h:190},B2:{x:210,y:180,w:330,h:190},
  B3:{x:540,y:180,w:220,h:190},C1:{x:0,y:370,w:280,h:190},C2:{x:280,y:370,w:160,h:190},C3:{x:440,y:370,w:160,h:190},C4:{x:600,y:370,w:160,h:190}};
const SLOT_ORDER=["C1","A1","C3","A3","A2","B3"];
const room=(r,cls,attrs)=>{
  const back=r.y===0, side=r.x+r.w===760;
  return `<div class="fl ${cls||""}" ${attrs||""} style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px">`+
    (back?`<div class="wt" style="width:${r.w}px;height:52px"><div class="win" style="left:14px;right:14px;top:14px;height:26px"></div></div>`:`<div class="wt" style="width:${r.w-56}px"></div>`)+
    (side?`<div class="wr" style="left:${r.w}px;width:52px;height:${r.h}px"><div class="win v" style="top:14px;bottom:14px;left:14px;width:26px"></div></div>`:`<div class="wr" style="left:${r.w}px;height:${r.h-56}px"></div>`)+`</div>`;
};
const desk=(x,y,w,h,mon,low)=>`<div class="shd" style="left:${x-2}px;top:${y+2}px;width:${w+6}px;height:${h+6}px"></div><div class="desk${low?" low":""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${mon===null?"":`<div class="mon ${mon?"m-"+mon:""}"></div>`}<div class="dfront"${low?' style="height:9px"':""}></div></div>`;
let OV=[];
const bb=(x,y,z,inner,attrs)=>{OV.push({x,y,z,inner,attrs:attrs||""});return "";};
const avatar=(name,cls)=>{const a=agentInfo(name);return `<div class="av ${cls||""}"><div class="h" style="background:${a.c}">${esc(a.m)}</div><div class="b" style="background:${light(a.c)}"></div></div>`;};
const PLANT=`<svg class="plant" viewBox="0 0 30 40" aria-hidden="true"><path d="M9 28h12l-2 11H11z" fill="#e7ecf3"/><circle cx="15" cy="14" r="9" fill="#3fa34d"/><circle cx="8" cy="19" r="6" fill="#56b85f"/><circle cx="22" cy="19" r="6" fill="#2f8f3e"/><circle cx="15" cy="7" r="5" fill="#6cc96f"/></svg>`;
function seg(x1,y1,x2,y2,k){
  const flow=["run","todo","me"].includes(k)?" flow":"";
  if(y1===y2){if(x1===x2)return"";const l=Math.min(x1,x2);return `<div class="path k-${k} h${flow}" style="left:${l-2}px;top:${y1-2}px;width:${Math.abs(x2-x1)+4}px;height:4px"></div>`;}

  if(a.me) return [a.me+" 等你","#b45309"]; if(a.state==="stale") return ["停滞","#b45309"]; if(a.run) return [a.run+" 进行中","#0e7490"];

}

    return `<button class="lrow" data-agent="${esc(a.name)}"><span class="dotav" style="background:${ai.c}">${esc(ai.m)}</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sname(a.name))}</span><span class="bar"><i style="width:${pct}%;background:${ai.c}"></i></span><span class="num">${a.done}/${a.cards.length}</span><span style="color:${sc};font-size:11.5px">${st}</span></button>`;}).join("")||`<p class="empty">还没有工作项</p>`;
}
function trow(t){ const ai=agentInfo(t.agent);
  const meta=t.status==="进行中"&&isStale(t)?`${ago(t.edited)}未更新`:t.status==="完成"?(t.done?md(t.done):"已完成"):(t.next?t.next.slice(0,40):`${ago(t.edited)}前更新`);
  return `<button class="trow" data-u="${esc(t.url)}"><span class="av30" style="background:${ai.c}">${esc(ai.m)}</span><span style="min-width:0"><span class="tt1">${esc(t.title)}</span><span class="tm">TK-${esc(t.id)} · ${esc(sname(t.agent))} · ${esc(meta)}</span></span>${pillFor(t)}</button>`; }
function renderOpen(M){
  const o=M.v.filter(isOpen).sort(openSort);

  $("open").innerHTML=o.slice(0,4).map(trow).join("")||`<p class="empty">没有未完成的卡，所有 agent 都已收工</p>`;
}
let chains=[],chainIdx=0;
function computeChains(M){
  const byKey=new Map(M.v.map(t=>[t.key,t])), adj=new Map();
  M.v.forEach(t=>t.related.forEach(k=>{ if(!byKey.has(k)||k===t.key)return; [[t.key,k],[k,t.key]].forEach(([a,b])=>{if(!adj.has(a))adj.set(a,new Set());adj.get(a).add(b);}); }));
  const hub=k=>(adj.get(k)||new Set()).size>6, seen=new Set(), out=[];
  M.v.forEach(t=>{ if(seen.has(t.key)||hub(t.key)||!adj.has(t.key))return;
    const comp=[],st=[t.key]; seen.add(t.key);
    while(st.length){const k=st.pop();comp.push(byKey.get(k));(adj.get(k)||[]).forEach(n=>{if(!seen.has(n)&&!hub(n)&&byKey.has(n)){seen.add(n);st.push(n);}});}
    if(comp.length>=2) out.push(comp.sort((a,b)=>a.id-b.id));
  });
  out.sort((a,b)=>(Number(b.some(isOpen))-Number(a.some(isOpen)))||Math.max(...b.map(c=>c.edited))-Math.max(...a.map(c=>c.edited)));
  chains=out.slice(0,8); if(chainIdx>=chains.length) chainIdx=0;
}
function renderChain(){
  const sel=$("chainSel");
  sel.innerHTML=chains.map((c,i)=>{const o=c[0].title.split("：")[0];return `<option value="${i}"${i===chainIdx?" selected":""}>${esc(o.length<10?o:"链路")} · TK-${c[0].id}–${c[c.length-1].id}</option>`;}).join("")||`<option>暂无</option>`;
  sel.disabled=!chains.length;
  const c=chains[chainIdx];
  if(!c){$("chain").innerHTML=`<p class="empty">还没有用「关联任务」连起来的卡</p>`;return;}
  const nodes=c.length>5?c.slice(-5):c, doneN=nodes.filter(t=>t.status==="完成").length, pct=Math.round(doneN/nodes.length*100);
  $("chain").innerHTML=`<div class="chain"><div class="ln" style="background:linear-gradient(var(--green) 0 ${pct}%,#c7d3e6 ${pct}%)"></div>${nodes.map(t=>{
    const d=t.status==="完成", plat=PLAT[t.platform]||t.platform;
    const right=d?(t.done?md(t.done):`<span style="color:var(--faint)">未填日期</span>`):pillFor(t);
    return `<button class="cnode" data-u="${esc(t.url)}"><span class="o" style="${d?"background:var(--green)":"background:#fff;border:2px solid var(--blue);box-sizing:border-box"}">${d?`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>`:""}</span><span style="min-width:0"><span class="tt1">TK-${esc(t.id)} ${esc(shortTitle(t.title))}</span><span class="tm">${esc(sname(t.agent))}${plat?" @ "+esc(plat):""}</span></span><span style="font-size:11px;color:var(--muted)">${right}</span></button>`;}).join("")}</div>`+
    (c.length>5?`<span class="foot">链路共 ${c.length} 张，显示最近 5 张</span>`:"");
}
$("chainSel").onchange=e=>{chainIdx=Number(e.target.value)||0;renderChain();};

const topBar=label=>`<div class="top">${label}<button class="x" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f1b2d" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;

    `<section class="sect"><h3>运行平台<span>按卡数</span></h3><div class="split">${pe.map(([k,n])=>`<span style="width:${n/a.cards.length*100}%;background:${PLATC[k]||"#94a3b8"}"></span>`).join("")}</div><div class="lg">${pe.map(([k,n])=>`<span><i style="background:${PLATC[k]||"#94a3b8"}"></i>${esc(PLAT[k]||"未填平台")} ${n}</span>`).join("")}</div></section>`+

function openZone(z){

    const me=v.filter(t=>t.status==="等我").sort((a,b)=>a.edited-b.edited), stale=v.filter(t=>isOpen(t)&&isStale(t)), rev=v.filter(needsRev);
    showDrawer(topBar("需要你")+`<div class="sect"><h3>等你决定<span>${me.length} 张</span></h3>${me.map(t=>tcard(t)).join("")||`<p class="empty">现在没有卡等你拍板</p>`}</div>`+
      `<div class="sect"><h3>停滞<span>超 48 小时未更新</span></h3>${stale.map(t=>tcard(t)).join("")||`<p class="empty">没有停滞的卡</p>`}</div>`+
      `<div class="sect"><h3>待复核<span>${rev.length} 张</span></h3>${rev.map(t=>tcard(t)).join("")||`<p class="empty">都已复核</p>`}</div>`,true);

  }

/* ---------- live data ---------- */
function setLive(k,txt){ const l=$("live"); l.className="live "+k; $("liveTxt").textContent=txt; }

let mcpRef=null;
const payloadOf=res=>extractJSON(res.payload??(res.content&&res.content[0]&&res.content[0].text));
async function allPages(first,url){ let j=first,rows=[...j.results],n=0;
  while(j.has_more&&j.next_cursor&&mcpRef&&n++<5){ const r=await mcpRef.callTool(SERVER,TOOL,viewQ(url,j.next_cursor),{cache:{staleTime:60000,gcTime:600000}});
    j=payloadOf(r); if(!j||!Array.isArray(j.results))break; rows=rows.concat(j.results);} return rows; }
async function onWork(res){ const j=payloadOf(res); if(!j||!Array.isArray(j.results)){setLive("warn","返回格式无法识别");return;}
  let rows=j.results; try{rows=await allPages(j,WORK_VIEW);}catch(e){}
  isDemo=false; banner(null); items=rows.map(norm); lastOk=res.cache?res.cache.storedAt:Date.now();
  setLive("","Live · "+hm(lastOk)+" 同步"); renderAll(); }
async function onProj(res){ const j=payloadOf(res); if(!j||!Array.isArray(j.results))return;
  let rows=j.results; try{rows=await allPages(j,PROJ_VIEW);}catch(e){}
  projNames={}; rows.forEach(r=>projNames[pid(r.url)]=r["简称"]||r["名称"]); renderAll(); }
function onErr(err){

    server_not_connected:"还没有连接 Notion，请在 claude.ai 设置 → 连接器 里添加 Notion。",

    not_in_manifest:"这个页面的 Notion 读取权限被关掉了。",consent_required:"需要你在 claude.ai 里确认 Notion 读取。"};
  if(msgs[c]){ items=[]; renderAll(); const ask=["approval_required","not_in_manifest","consent_required"].includes(c);
    banner(`<b>读不到 Notion</b><br>${msgs[c]}${ask?'<br><button id="ask">允许读取 Notion</button>':""}`); if(ask)$("ask").onclick=oneShot;
    setLive("err","未连接"); return; }
  setLive("warn",lastOk?"数据停在 "+hm(lastOk):"暂时读不到");
  if(!items.length) banner(`<b>暂时读不到 Notion</b><br>${c==="tool_error"?"Notion 返回错误："+esc((err.message||"").slice(0,140)):"Notion 没响应"}。稍后点右上角刷新。`);
}
async function oneShot(){ try{ await onWork(await mcpRef.callTool(SERVER,TOOL,WORK_Q,{cache:{refresh:true,staleTime:0,gcTime:600000}}));

$("live").onclick=()=>{};
(async()=>{
  // Standalone mode: fetch from local API proxy (Vercel serverless) instead of Claude MCP
  async function loadData(){
    setLive("warn","刷新中");
    try{
      const [workRes, projRes] = await Promise.all([
        fetch("/api/work").then(r=>r.ok?r.json():Promise.reject(new Error("work "+r.status))),
        fetch("/api/proj").then(r=>r.ok?r.json():Promise.reject(new Error("proj "+r.status)))
      ]);
      if(workRes.error) throw new Error(workRes.error);
      isDemo=false; banner(null);
      items = (workRes.results||[]).map(norm);
      lastOk = Date.now();
      if(projRes.results){
        projNames={}; projRes.results.forEach(r=>projNames[pid(r.url)]=r["简称"]||r["名称"]||"");
      }
      setLive("","Live · "+hm(lastOk)+" 同步");
      renderAll();
    }catch(e){
      console.error(e);
      if(!items.length) demo("无法连接 Notion 代理（请在 Vercel 设置 NOTION_TOKEN 环境变量）。");
      else setLive("warn","刷新失败");
    }
  }
  $("live").onclick=loadData;
  // initial load
  loadData();
  // refresh every 2 min
  setInterval(loadData, 120000);
})();
})();
